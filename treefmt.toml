[formatter.nix]
command = "nixfmt"
includes = ["*.nix"]

[formatter.biome]
command = "biome"
options = ["format", "--write"]
includes = ["*.mjs"]

[formatter.prettier]
command = "prettier"
options = ["--write"]
includes = ["*.yaml"]

[formatter.toml]
command = "taplo"
options = ["format", "$@"]
includes = ["*.toml"]

[formatter.markdown]
command = "rumdl"
options = ["fmt"]
includes = ["*.md"]

[formatter.shell]
command = "sh"
options = ["-eucx", """
# Perform static analysis tool
shellcheck --external-sources --source-path=SCRIPTDIR "$@"

# Run formatter
shfmt --write --simplify --case-indent --indent 4 "$@"
    """, "--"]
includes = ["*.sh"]
